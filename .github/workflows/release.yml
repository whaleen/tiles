name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-13

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/tiles-tauri/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/tiles-tauri/src-tauri

      - name: Install frontend dependencies
        working-directory: apps/tiles-tauri
        run: npm install

      - name: Build
        working-directory: apps/tiles-tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build --target universal-apple-darwin

      - name: Package and sign updater artifact
        working-directory: apps/tiles-tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          BUNDLE="src-tauri/target/universal-apple-darwin/release/bundle/macos"
          tar czf /tmp/tiles.app.tar.gz -C "$BUNDLE" tiles.app
          cp /tmp/tiles.app.tar.gz "$BUNDLE/tiles.app.tar.gz"
          npm run tauri -- signer sign \
            --private-key "$TAURI_SIGNING_PRIVATE_KEY" \
            --password "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" \
            "$BUNDLE/tiles.app.tar.gz"

      - name: Create release and upload artifacts
        working-directory: apps/tiles-tauri
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          TAG: ${{ github.ref_name }}
        run: |
          BUNDLE="src-tauri/target/universal-apple-darwin/release/bundle"
          gh release create "$TAG" \
            --title "tiles $TAG" \
            --notes "" \
            --repo whaleen/tiles \
            "$BUNDLE/dmg/tiles_${TAG#v}_universal.dmg" \
            "$BUNDLE/macos/tiles.app.tar.gz" \
            "$BUNDLE/macos/tiles.app.tar.gz.sig"

      - name: Update homebrew cask and tiles-latest.json
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          BUNDLE="apps/tiles-tauri/src-tauri/target/universal-apple-darwin/release/bundle"
          SIG_CONTENT=$(cat "$BUNDLE/macos/tiles.app.tar.gz.sig")

          RELEASE=$(gh api repos/whaleen/tiles/releases/tags/$TAG)
          URL=$(echo "$RELEASE" | jq -r '.assets[] | select(.name | endswith("app.tar.gz")) | .browser_download_url')
          PUB_DATE=$(echo "$RELEASE" | jq -r '.published_at')

          DMG_PATH="apps/tiles-tauri/src-tauri/target/universal-apple-darwin/release/bundle/dmg/tiles_${VERSION}_universal.dmg"
          SHA256=$(shasum -a 256 "$DMG_PATH" | awk '{print $1}')
          DMG_URL=$(echo "$RELEASE" | jq -r '.assets[] | select(.name | endswith(".dmg")) | .browser_download_url')

          git clone https://x-access-token:$GH_TOKEN@github.com/whaleen/homebrew-tap.git /tmp/homebrew-tap
          cd /tmp/homebrew-tap

          jq -n \
            --arg version "$VERSION" \
            --arg pub_date "$PUB_DATE" \
            --arg url "$URL" \
            --arg sig "$SIG_CONTENT" \
            '{
              version: $version,
              pub_date: $pub_date,
              platforms: {
                "darwin-aarch64": { url: $url, signature: $sig },
                "darwin-x86_64":  { url: $url, signature: $sig }
              }
            }' > tiles-latest.json

          sed -i '' "s/version \".*\"/version \"${VERSION}\"/" Casks/tiles.rb
          sed -i '' "s/sha256 \".*\"/sha256 \"${SHA256}\"/" Casks/tiles.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tiles-latest.json Casks/tiles.rb
          git commit -m "update: tiles $TAG"
          git push
